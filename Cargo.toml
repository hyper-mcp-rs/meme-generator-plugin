[package]
name = "meme-generator"
version = "0.1.4"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
ab_glyph = "0.2"
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
serde_yaml = "0.9"
extism-pdk = "1.4"
git-version = "0.3"
base64-serde = "0.7"
base64 = "0.21"

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
